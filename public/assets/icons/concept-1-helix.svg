<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18161c"/>
      <stop offset="100%" stop-color="#0a090b"/>
    </linearGradient>
    <linearGradient id="orangeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#ff3b00"/>
    </linearGradient>
    <linearGradient id="creamGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="100%" stop-color="#f6d7a1"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff4c00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad1)" stroke="#2d2a33" stroke-width="4"/>

  <!-- Open Book Base Foundation -->
  <g transform="translate(256, 360)">
    <!-- Left page -->
    <path d="M-130 0 C-70 -25, -20 -10, 0 16 C-20 -35, -75 -48, -130 -22 Z" fill="url(#creamGrad1)" opacity="0.9"/>
    <!-- Right page -->
    <path d="M130 0 C70 -25, 20 -10, 0 16 C20 -35, 75 -48, 130 -22 Z" fill="url(#creamGrad1)" opacity="0.9"/>
    <!-- Spine notch -->
    <circle cx="0" cy="18" r="5" fill="#ff4c00"/>
  </g>

  <!-- The Central Staff of Asclepius (Stylus/Pen) -->
  <path d="M256 100 L256 360" stroke="url(#creamGrad1)" stroke-width="14" stroke-linecap="round"/>
  <!-- Staff Golden Finial Nib -->
  <polygon points="256,76 266,102 246,102" fill="url(#creamGrad1)"/>
  <circle cx="256" cy="74" r="5" fill="#ff4c00"/>

  <!-- The Entwined Serpent of Knowledge & Healing -->
  <path d="M 210 320
           C 170 290, 190 250, 256 250
           C 325 250, 340 205, 305 175
           C 270 145, 240 160, 256 125
           C 264 108, 280 106, 290 114"
        fill="none"
        stroke="url(#orangeGrad1)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow1)"/>

  <!-- Serpent Head Accent & Eye -->
  <circle cx="292" cy="116" r="10" fill="#ff4c00"/>
  <circle cx="294" cy="114" r="3.5" fill="#fff"/>

  <!-- Ascending Spark / AI Neural Illumination Beacon -->
  <path d="M256 42 L260 56 L274 60 L260 64 L256 78 L252 64 L238 60 L252 56 Z" fill="#ff4c00"/>
</svg>
